<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meteor Garden</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .slide {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      max-width: 1200px;
      width: 90%;
      padding: 40px;
    }

    .poster {
      flex-shrink: 0;
      width: 320px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      transition: transform 0.3s;
    }
    .poster:hover { transform: scale(1.03); }

    .info {
      max-width: 500px;
    }

    .info h1 {
      font-size: 3rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #f7971e, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .info .tagline {
      font-size: 1.1rem;
      color: #ccc;
      margin-bottom: 30px;
      font-style: italic;
    }

    .info table {
      border-collapse: collapse;
      width: 100%;
    }

    .info table td {
      padding: 10px 14px;
      font-size: 1.15rem;
      vertical-align: top;
    }

    .info table td:first-child {
      color: #ffd200;
      font-weight: 600;
      white-space: nowrap;
      width: 110px;
    }

    .info table tr {
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .fullscreen-btn {
      position: fixed;
      bottom: 24px;
      right: 28px;
      background: rgba(255, 210, 0, 0.9);
      color: #1a1a2e;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      z-index: 10;
    }
    .fullscreen-btn:hover {
      background: #f7971e;
      transform: scale(1.05);
    }

    @media (max-width: 800px) {
      .slide { flex-direction: column; gap: 30px; }
      .poster { width: 220px; }
      .info h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>

  <div class="slide">
    <img class="poster" src="FILM_meteor_garden.jpg" alt="Meteor Garden Poster">

    <div class="info">
      <h1>Meteor Garden <span style="font-size:1.8rem; -webkit-text-fill-color:#ccc;">(Liúxīng Huāyuán)</span></h1>
      <p class="tagline">流星花園</p>

      <table>
        <tr>
          <td>Year</td>
          <td>2018</td>
        </tr>
        <tr>
          <td>Director</td>
          <td>Lin Helong</td>
        </tr>
        <tr>
          <td>Episodes</td>
          <td>49</td>
        </tr>
        <tr>
          <td>Cast</td>
          <td>
            Shen Yue — Dong Shancai<br>
            Dylan Wang — Daoming Si<br>
            Darren Chen — Hua Ze Lei<br>
            Caesar Wu — Xi Men<br>
            Connor Leong — Mei Zuo
          </td>
        </tr>
        <tr>
          <td>Genre</td>
          <td>Romance · Comedy · Drama</td>
        </tr>
      </table>
    </div>
  </div>

  <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>

  <script>
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const btn = document.querySelector('.fullscreen-btn');
      btn.textContent = document.fullscreenElement ? '✕ Exit' : '⛶ Fullscreen';
    });
  </script>
</body>
</html>
