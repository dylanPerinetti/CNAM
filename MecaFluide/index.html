<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mécanique des fluides — Cours CNAM (AEA110)</title>

<!-- Marked.js pour rendre le Markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- KaTeX pour rendre les formules LaTeX -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<!-- Highlight.js pour coloration -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>

<style>
  :root {
    --bg: #0d1117;
    --bg-2: #161b22;
    --bg-3: #1f2937;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --primary: #4f9eff;
    --primary-2: #2563eb;
    --accent: #f59e0b;
    --border: #30363d;
    --code-bg: #1f2937;
    --hover: #21262d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-columns: 320px 1fr;
    grid-template-rows: 60px 1fr;
    grid-template-areas: "header header" "sidebar main";
  }

  /* HEADER */
  header {
    grid-area: header;
    background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
    display: flex;
    align-items: center;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
    z-index: 10;
  }
  header h1 {
    font-size: 18px;
    color: white;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 .icon { font-size: 22px; }
  header .badge {
    background: rgba(255,255,255,.18);
    color: white;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
    margin-left: 12px;
  }
  header .spacer { flex: 1; }
  header .search {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 6px;
    padding: 6px 12px;
    color: white;
    font-size: 13px;
    width: 240px;
    outline: none;
  }
  header .search::placeholder { color: rgba(255,255,255,.6); }

  /* SIDEBAR */
  aside {
    grid-area: sidebar;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px 0;
  }
  .sidebar-section {
    margin-bottom: 24px;
  }
  .sidebar-title {
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--text-muted);
    padding: 0 24px 8px;
    font-weight: 600;
  }
  .nav-item {
    display: block;
    padding: 10px 24px;
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    border-left: 3px solid transparent;
    transition: all .15s;
    cursor: pointer;
    user-select: none;
  }
  .nav-item:hover {
    background: var(--hover);
    border-left-color: var(--primary);
  }
  .nav-item.active {
    background: rgba(79,158,255,.12);
    border-left-color: var(--primary);
    color: var(--primary);
    font-weight: 600;
  }
  .nav-item .num {
    display: inline-block;
    width: 28px;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 600;
  }
  .nav-item.active .num { color: var(--primary); }
  .nav-item.special {
    color: var(--accent);
  }
  .nav-item.special::before {
    content: "⭐ ";
  }

  /* MAIN */
  main {
    grid-area: main;
    overflow-y: auto;
    padding: 40px 60px;
    max-width: 100%;
  }
  .content {
    max-width: 880px;
    margin: 0 auto;
  }
  .content.home {
    text-align: center;
    padding: 40px 0;
  }
  .home h2 {
    font-size: 36px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .home p.lead {
    font-size: 16px;
    color: var(--text-muted);
    margin-bottom: 40px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
    text-align: left;
    margin-top: 30px;
  }
  .card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    cursor: pointer;
    transition: all .2s;
  }
  .card:hover {
    border-color: var(--primary);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(79,158,255,.2);
  }
  .card .num {
    display: inline-block;
    background: var(--primary);
    color: white;
    width: 28px;
    height: 28px;
    line-height: 28px;
    text-align: center;
    border-radius: 50%;
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .card h3 { font-size: 15px; margin-bottom: 8px; }
  .card p {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  /* MARKDOWN content */
  .md h1 { font-size: 32px; margin: 0 0 24px; padding-bottom: 12px; border-bottom: 2px solid var(--border); }
  .md h2 { font-size: 24px; margin: 36px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); color: #60a5fa; }
  .md h3 { font-size: 19px; margin: 28px 0 12px; color: #a78bfa; }
  .md h4 { font-size: 16px; margin: 20px 0 10px; color: var(--accent); }
  .md p { margin: 12px 0; line-height: 1.7; }
  .md ul, .md ol { margin: 12px 0 12px 24px; }
  .md li { margin: 6px 0; line-height: 1.6; }
  .md strong { color: #fff; font-weight: 600; }
  .md em { color: #fbbf24; }
  .md blockquote {
    border-left: 4px solid var(--accent);
    background: rgba(245,158,11,.07);
    padding: 12px 18px;
    margin: 16px 0;
    border-radius: 0 6px 6px 0;
  }
  .md code {
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Fira Code', Menlo, monospace;
    font-size: .9em;
    color: #f97583;
  }
  .md pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 16px 0;
    line-height: 1.5;
  }
  .md pre code {
    background: none;
    padding: 0;
    color: inherit;
    font-size: 13px;
  }
  .md table {
    border-collapse: collapse;
    width: 100%;
    margin: 16px 0;
    font-size: 14px;
  }
  .md table th, .md table td {
    border: 1px solid var(--border);
    padding: 10px 14px;
    text-align: left;
  }
  .md table th {
    background: var(--bg-3);
    font-weight: 600;
    color: var(--primary);
  }
  .md table tr:nth-child(even) { background: rgba(255,255,255,.02); }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

  /* KaTeX */
  .katex-display {
    margin: 16px 0 !important;
    padding: 12px;
    background: rgba(79,158,255,.05);
    border-radius: 6px;
    overflow-x: auto;
  }
  .katex { font-size: 1.05em; }

  /* Loading */
  .loader {
    text-align: center;
    color: var(--text-muted);
    padding: 60px 20px;
  }
  .spinner {
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    width: 32px;
    height: 32px;
    margin: 0 auto 16px;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: #484f58; }

  /* Responsive */
  @media (max-width: 768px) {
    body { grid-template-columns: 1fr; grid-template-areas: "header" "main"; }
    aside { display: none; }
    main { padding: 20px; }
  }
</style>
</head>
<body>

<header>
  <h1><span class="icon">🌊</span> Mécanique des Fluides <span class="badge">CNAM AEA110</span></h1>
  <div class="spacer"></div>
  <input class="search" id="searchInput" type="search" placeholder="Rechercher dans les cours…">
</header>

<aside>
  <div class="sidebar-section">
    <div class="sidebar-title">📖 Cours</div>
    <div id="navList"></div>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-title">📚 Ressources</div>
    <a class="nav-item" href="#" onclick="loadHome()">🏠 Accueil</a>
  </div>
</aside>

<main>
  <div class="content" id="content">
    <!-- contenu chargé dynamiquement -->
  </div>
</main>

<script>
const COURSES = [
  { file: '01-introduction.md',     title: 'Introduction générale',           desc: 'Définitions, propriétés, hypothèse du milieu continu' },
  { file: '02-cinematique.md',      title: 'Cinématique des fluides',         desc: 'Eulérien/Lagrangien, dérivée particulaire, lignes de courant' },
  { file: '03-equations-bilans.md', title: 'Équations de bilans',             desc: 'Reynolds, continuité, quantité de mouvement' },
  { file: '04-bilan-energie.md',    title: 'Bilan d\'énergie',                desc: 'Premier principe, dissipation, pertes de charge' },
  { file: '05-bernoulli.md',        title: 'Théorèmes de Bernoulli',          desc: 'Bernoulli classique et généralisé, applications' },
  { file: '06-sustentation.md',     title: 'Principes de sustentation',       desc: 'Portance, traînée, profils d\'aile, décrochage' },
  { file: '07-navier-stokes.md',    title: 'Modèle de Navier-Stokes',         desc: 'Construction, résolutions analytiques, conditions limites' },
  { file: '08-adimensionnement.md', title: 'Adimensionnement',                desc: 'Reynolds, Mach, Froude, Vaschy-Buckingham, similitude' },
  { file: '09-fiches-revisions.md', title: 'Fiches de révision',              desc: 'Formules, méthodologie, pièges classiques', special: true },
];

const navList = document.getElementById('navList');
const content = document.getElementById('content');

// Configuration de marked
marked.setOptions({
  highlight: function(code, lang) {
    if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
    return hljs.highlightAuto(code).value;
  },
  breaks: false,
  gfm: true
});

// Construction de la sidebar
COURSES.forEach((c, i) => {
  const item = document.createElement('a');
  item.className = 'nav-item' + (c.special ? ' special' : '');
  item.href = '#' + c.file;
  item.dataset.file = c.file;
  item.innerHTML = `<span class="num">${String(i+1).padStart(2,'0')}</span>${c.title}`;
  item.addEventListener('click', e => { e.preventDefault(); loadCourse(c.file); });
  navList.appendChild(item);
});

async function loadCourse(file) {
  // Mettre à jour la nav active
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.file === file));
  // Loading
  content.classList.remove('home');
  content.innerHTML = '<div class="loader"><div class="spinner"></div>Chargement…</div>';

  try {
    const res = await fetch('cours/' + file);
    if (!res.ok) throw new Error('Fichier introuvable : ' + file);
    const md = await res.text();
    content.innerHTML = '<div class="md">' + marked.parse(md) + '</div>';
    // Render LaTeX
    renderMathInElement(content, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\[', right: '\\]', display: true },
        { left: '\\(', right: '\\)', display: false }
      ],
      throwOnError: false
    });
    // Update URL hash
    history.replaceState(null, '', '#' + file);
    // Scroll top
    document.querySelector('main').scrollTo({ top: 0, behavior: 'smooth' });
  } catch (err) {
    content.innerHTML = `<div class="md"><h1>❌ Erreur</h1><p>${err.message}</p>
      <p>Si tu ouvres ce site directement avec <code>file://</code>, ton navigateur peut bloquer les requêtes <code>fetch()</code>.<br>
      Lance plutôt un mini-serveur local depuis le dossier MecaFluide :</p>
      <pre><code>python3 -m http.server 8000</code></pre>
      <p>puis ouvre <code>http://localhost:8000</code> dans ton navigateur.</p></div>`;
  }
}

function loadHome() {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  content.classList.add('home');
  let html = `
    <h2>🌊 Mécanique des Fluides Fondamentale</h2>
    <p class="lead">Cours complet du module CNAM <strong>AEA110</strong> — tout ce qu'il te faut pour réussir l'examen</p>
    <p>Sélectionne un chapitre dans la barre latérale, ou clique sur l'une des cartes ci-dessous :</p>
    <div class="cards">`;
  COURSES.forEach((c, i) => {
    html += `<div class="card" onclick="loadCourse('${c.file}')">
      <div class="num">${i+1}</div>
      <h3>${c.title}</h3>
      <p>${c.desc}</p>
    </div>`;
  });
  html += `</div>`;
  content.innerHTML = html;
  history.replaceState(null, '', '#');
}

// Recherche : filtre la sidebar
document.getElementById('searchInput').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('#navList .nav-item').forEach(n => {
    const match = n.textContent.toLowerCase().includes(q);
    n.style.display = match ? '' : 'none';
  });
});

// Bootstrap
const initialHash = location.hash.replace('#','');
if (initialHash && COURSES.some(c => c.file === initialHash)) {
  loadCourse(initialHash);
} else {
  loadHome();
}
</script>
</body>
</html>
