<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mécanique des Fluides — Cours et exercices</title>

<!-- Marked.js -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<!-- KaTeX -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<!-- Highlight.js -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>

<style>
  :root {
    --bg: #0d1117;
    --bg-2: #161b22;
    --bg-3: #1f2937;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --primary: #4f9eff;
    --primary-2: #2563eb;
    --accent: #f59e0b;
    --accent-2: #a78bfa;
    --border: #30363d;
    --code-bg: #1f2937;
    --hover: #21262d;
    --success: #3fb950;
    --sidebar-w: 300px;
    --header-h: 60px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    grid-template-rows: var(--header-h) 1fr;
    grid-template-areas: "header header" "sidebar main";
  }

  /* HEADER */
  header {
    grid-area: header;
    background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
    display: flex;
    align-items: center;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
    z-index: 100;
    gap: 12px;
  }
  header .menu-toggle {
    display: none;
    background: rgba(255,255,255,.18);
    border: none;
    color: white;
    width: 36px;
    height: 36px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 18px;
  }
  header h1 {
    font-size: 17px;
    color: white;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  header h1 .icon { font-size: 22px; }
  header .spacer { flex: 1; }
  header .search {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 6px;
    padding: 6px 12px;
    color: white;
    font-size: 13px;
    width: 240px;
    outline: none;
    transition: all .2s;
  }
  header .search:focus {
    background: rgba(255,255,255,.2);
    width: 280px;
  }
  header .search::placeholder { color: rgba(255,255,255,.6); }

  /* SIDEBAR */
  aside {
    grid-area: sidebar;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px 0;
    transition: transform .25s ease;
  }
  .sidebar-section {
    margin-bottom: 24px;
  }
  .sidebar-title {
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--text-muted);
    padding: 0 24px 8px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .nav-item {
    display: block;
    padding: 9px 24px;
    color: var(--text);
    text-decoration: none;
    font-size: 13.5px;
    border-left: 3px solid transparent;
    transition: all .15s;
    cursor: pointer;
    user-select: none;
  }
  .nav-item:hover {
    background: var(--hover);
    border-left-color: var(--primary);
  }
  .nav-item.active {
    background: rgba(79,158,255,.12);
    border-left-color: var(--primary);
    color: var(--primary);
    font-weight: 600;
  }
  .nav-item .num {
    display: inline-block;

    color: var(--text-muted);

  }
  .nav-item.active .num { color: var(--primary); }
  .nav-item.special { color: var(--accent); }

  .nav-item.exo .num { color: var(--accent-2); }
  .nav-item.about::before { content: "ℹ️ "; }

  /* MAIN */
  main {
    grid-area: main;
    overflow-y: auto;
    padding: 30px 50px;
  }
  .content {
    max-width: 880px;
    margin: 0 auto;
  }
  .content.home {

  }
  .home h2 {

    background: linear-gradient(135deg, #60a5fa, #a78bfa);

  .section-title {

  .card:hover {
    border-color: var(--primary);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(79,158,255,.2);
  }
  .card.exo:hover {

  .card .num {

  .card p { font-size: 12px; color: var(--text-muted); line-height: 1.4; }

  /* MARKDOWN */
  .md h1 { font-size: clamp(24px, 3vw, 32px); margin: 0 0 20px; padding-bottom: 12px; border-bottom: 2px solid var(--border); }
  .md h2 { font-size: clamp(19px, 2vw, 24px); margin: 32px 0 14px; padding-bottom: 6px; border-bottom: 1px solid var(--border); color: #60a5fa; }
  .md h3 { font-size: clamp(16px, 1.6vw, 19px); margin: 24px 0 10px; color: #a78bfa; }
  .md h4 { font-size: 15px; margin: 18px 0 8px; color: var(--accent); }
  .md p { margin: 11px 0; line-height: 1.7; }
  .md ul, .md ol { margin: 10px 0 10px 22px; }
  .md li { margin: 5px 0; line-height: 1.6; }
  .md strong { color: #fff; font-weight: 600; }
  .md em { color: #fbbf24; font-style: italic; }
  .md blockquote {
    border-left: 4px solid var(--accent);
    background: rgba(245,158,11,.07);
    padding: 10px 16px;
    margin: 14px 0;
    border-radius: 0 6px 6px 0;
  }
  .md code:not(pre code) {
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Fira Code', Menlo, monospace;
    font-size: .9em;

  .md pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    padding: 14px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 14px 0;
    line-height: 1.5;
  }
  .md pre code { background: none; padding: 0; color: inherit; font-size: 13px; }
  .md table {
    border-collapse: collapse;
    width: 100%;
    margin: 14px 0;
    font-size: 13.5px;
    overflow-x: auto;
    display: block;

  .md table thead, .md table tbody, .md table tr { display: table; width: 100%; table-layout: auto; }
  .md table th, .md table td {

  .md table th { background: var(--bg-3); font-weight: 600; color: var(--primary); }
  .md table tr:nth-child(even) { background: rgba(255,255,255,.02); }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 22px 0; }

  /* KaTeX */
  .katex-display {
    margin: 14px 0 !important;
    padding: 10px;
    background: rgba(79,158,255,.05);
    border-radius: 6px;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .katex { font-size: 1.05em; }

  /* About box */

    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    margin: 24px 0;

  .about-box h3 { color: var(--primary); margin-bottom: 12px; }
  .about-box p { line-height: 1.7; margin: 8px 0; color: var(--text); }
  .about-box .label { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-top: 16px; }
  .about-box ul { margin-left: 20px; margin-top: 8px; }
  .about-box li { margin: 6px 0; line-height: 1.6; }
  .about-box .author-name {
    color: var(--accent);
    font-weight: 600;
    font-size: 16px;

  /* Loading */

    color: var(--text-muted);

  }
  .spinner {
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    width: 32px; height: 32px;
    margin: 0 auto 16px;

  /* Scrollbar */

  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: #484f58; }

  /* Backdrop pour mobile */
  .backdrop {

    position: fixed;
    inset: var(--header-h) 0 0 0;

  /* RESPONSIVE — tablette */
  @media (max-width: 1024px) {

    main { padding: 24px 32px; }
    header .search { width: 200px; }
    header .search:focus { width: 220px; }

  /* RESPONSIVE — mobile */
  @media (max-width: 768px) {
    body {
      grid-template-columns: 1fr;
      grid-template-areas: "header" "main";
    }
    header .menu-toggle { display: inline-flex; align-items: center; justify-content: center; }
    header h1 { font-size: 15px; }
    header h1 .icon { font-size: 19px; }
    header .search { width: 130px; font-size: 12px; }
    header .search:focus { width: 160px; }
    aside {
      position: fixed;
      top: var(--header-h);
      bottom: 0;
      left: 0;
      width: 280px;
      z-index: 60;
      transform: translateX(-100%);
      box-shadow: 4px 0 16px rgba(0,0,0,.4);
    }
    aside.open { transform: translateX(0); }
    aside.open ~ .backdrop { display: block; }
    main { padding: 18px 16px; }
    .md table { font-size: 12px; }
    .md table th, .md table td { padding: 6px 8px; }
    .md pre { padding: 10px; font-size: 12px; }
    .katex-display { font-size: .9em; padding: 6px; }
    .home h2 { font-size: 24px; }
    .cards { grid-template-columns: 1fr 1fr; gap: 10px; }
    .card { padding: 14px; }
  }
  @media (max-width: 480px) {
    header { padding: 0 12px; gap: 8px; }
    header h1 { font-size: 13px; }
    header h1 .icon { font-size: 17px; }
    header .search { width: 100px; padding: 5px 8px; }
    header .search:focus { width: 120px; }
    main { padding: 14px 12px; }
    .cards { grid-template-columns: 1fr; }
    .about-box { padding: 18px; }
  }
</style>
</head>
<body>

<header>
  <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
  <h1><span class="icon">🌊</span> Mécanique des Fluides</h1>
  <div class="spacer"></div>
  <input class="search" id="searchInput" type="search" placeholder="Rechercher…">
</header>

<aside id="sidebar">
  <div class="sidebar-section">
    <div class="sidebar-title">📖 Cours</div>
    <div id="navCours"></div>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-title">✏️ Exercices corrigés</div>
    <div id="navExos"></div>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-title">📚 Ressources</div>
    <a class="nav-item" href="#" onclick="loadHome(event)">🏠 Accueil</a>
    <a class="nav-item about" href="#about" onclick="loadAbout(event)">À propos</a>
  </div>
</aside>

<div class="backdrop" id="backdrop"></div>

<main>
  <div class="content" id="content"></div>
</main>

<script>
const COURSES = [
  { file: 'cours/01-introduction.md',     title: 'Introduction générale',           desc: 'Définitions, propriétés, milieu continu' },
  { file: 'cours/02-cinematique.md',      title: 'Cinématique des fluides',         desc: 'Eulérien/Lagrangien, dérivée particulaire, lignes de courant' },
  { file: 'cours/03-equations-bilans.md', title: 'Équations de bilans',             desc: 'Reynolds, continuité, quantité de mouvement' },
  { file: 'cours/04-bilan-energie.md',    title: 'Bilan d\'énergie',                desc: 'Premier principe, dissipation, pertes de charge' },
  { file: 'cours/05-bernoulli.md',        title: 'Théorèmes de Bernoulli',          desc: 'Bernoulli, Pitot, Venturi, Torricelli' },
  { file: 'cours/06-sustentation.md',     title: 'Principes de sustentation',       desc: 'Portance, traînée, profils d\'aile' },
  { file: 'cours/07-navier-stokes.md',    title: 'Modèle de Navier-Stokes',         desc: 'Construction, Poiseuille, Couette' },
  { file: 'cours/08-adimensionnement.md', title: 'Adimensionnement',                desc: 'Reynolds, Mach, Froude, similitude' },
  { file: 'cours/09-fiches-revisions.md', title: 'Fiches de révision',              desc: 'Formules, méthodologie, pièges classiques', special: true },
];

const EXOS = [
  { file: 'exercices/01-cinematique-exos.md',      title: 'Cinématique',           desc: 'Accélération, lignes de courant, vorticité' },
  { file: 'exercices/02-bilans-exos.md',           title: 'Bilans',                desc: 'Conservation du débit, force sur paroi, aubage' },
  { file: 'exercices/03-bernoulli-exos.md',        title: 'Bernoulli',             desc: 'Vidange, Pitot, Venturi, pompe' },
  { file: 'exercices/04-navier-stokes-exos.md',    title: 'Navier-Stokes',         desc: 'Poiseuille, Couette, Stokes' },
  { file: 'exercices/05-adimensionnement-exos.md', title: 'Adimensionnement',      desc: 'Vaschy-Buckingham, similitude' },
];

const navCours = document.getElementById('navCours');
const navExos = document.getElementById('navExos');
const content = document.getElementById('content');
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('backdrop');

// Sidebar : cours
COURSES.forEach((c, i) => {
  const item = document.createElement('a');
  item.className = 'nav-item' + (c.special ? ' special' : '');
  item.href = '#' + c.file;
  item.dataset.file = c.file;
  item.innerHTML = `<span class="num">${String(i+1).padStart(2,'0')}</span>${c.title}`;
  item.addEventListener('click', e => { e.preventDefault(); loadCourse(c.file); closeSidebar(); });
  navCours.appendChild(item);
});

// Sidebar : exos
EXOS.forEach((c, i) => {
  const item = document.createElement('a');
  item.className = 'nav-item exo';
  item.href = '#' + c.file;
  item.dataset.file = c.file;
  item.innerHTML = `<span class="num">E${String(i+1).padStart(2,'0')}</span>${c.title}`;
  item.addEventListener('click', e => { e.preventDefault(); loadCourse(c.file); closeSidebar(); });
  navExos.appendChild(item);
});

/* === RENDU MARKDOWN + KaTeX (sans interférence) ===
   On extrait d'abord les expressions math en placeholders, on parse le markdown,
   puis on remplace les placeholders par le HTML KaTeX rendu. */
function renderMarkdownWithMath(md) {
  const blocks = [];
  // 1) Display math $$...$$
  md = md.replace(/\$\$([\s\S]+?)\$\$/g, (m, formula) => {
    const id = blocks.length;
    blocks.push({ formula: formula.trim(), display: true });
    return `\n\n@@MATH${id}@@\n\n`;
  });
  // 2) Inline math $...$ (un seul $, pas de saut de ligne, pas double $)
  md = md.replace(/(^|[^\$])\$([^\$\n]+?)\$(?!\$)/g, (m, pre, formula) => {
    const id = blocks.length;
    blocks.push({ formula: formula.trim(), display: false });
    return pre + `@@MATH${id}@@`;
  });
  // 3) Markdown -> HTML
  let html = marked.parse(md);
  // 4) Replace math placeholders with KaTeX-rendered HTML
  html = html.replace(/@@MATH(\d+)@@/g, (m, id) => {
    const { formula, display } = blocks[parseInt(id, 10)];
    try {
      return katex.renderToString(formula, {
        displayMode: display,
        throwOnError: false,
        strict: false,
      });
    } catch (e) {
      return `<code class="katex-error">${formula}</code>`;
    }
  });
  return html;
}

marked.setOptions({
  highlight: function(code, lang) {
    if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
    return hljs.highlightAuto(code).value;
  },
  breaks: false,
  gfm: true
});

async function loadCourse(file) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.file === file));
  content.classList.remove('home');
  content.innerHTML = '<div class="loader"><div class="spinner"></div>Chargement…</div>';

  try {
    const res = await fetch(file);
    if (!res.ok) throw new Error('Fichier introuvable : ' + file);
    const md = await res.text();
    content.innerHTML = '<div class="md">' + renderMarkdownWithMath(md) + '</div>';
    history.replaceState(null, '', '#' + file);
    document.querySelector('main').scrollTo({ top: 0, behavior: 'smooth' });
  } catch (err) {
    content.innerHTML = `<div class="md"><h1>❌ Erreur</h1><p>${err.message}</p>
      <p>Si tu ouvres ce site directement avec <code>file://</code>, ton navigateur peut bloquer les requêtes <code>fetch()</code>.<br>
      Lance plutôt un mini-serveur local depuis le dossier <code>MecaFluide</code> :</p>
      <pre><code>python3 -m http.server 8000</code></pre>
      <p>puis ouvre <code>http://localhost:8000</code> dans ton navigateur.</p></div>`;
  }
}

function loadHome(e) {
  if (e) e.preventDefault();
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  content.classList.add('home');
  let html = `
    <h2>🌊 Mécanique des Fluides Fondamentale</h2>
    <p class="lead">Cours complet et exercices corrigés — tout ce qu'il te faut pour réussir l'examen</p>
    <p class="author">Rédigé par <strong>Dylan Perinetti</strong> · D'après le cours de M. Alfarez (CNAM)</p>

    <h3 class="section-title">📖 Les chapitres de cours</h3>
    <div class="cards">`;
  COURSES.forEach((c, i) => {
    html += `<div class="card" onclick="loadCourse('${c.file}')">
      <div class="num">${i+1}</div>
      <h3>${c.title}</h3>
      <p>${c.desc}</p>
    </div>`;
  });
  html += `</div>
    <h3 class="section-title">✏️ Exercices corrigés</h3>
    <div class="cards">`;
  EXOS.forEach((c, i) => {
    html += `<div class="card exo" onclick="loadCourse('${c.file}')">
      <div class="num">E${i+1}</div>
      <h3>${c.title}</h3>
      <p>${c.desc}</p>
    </div>`;
  });
  html += `</div>`;
  content.innerHTML = html;
  history.replaceState(null, '', '#');
  closeSidebar();
}

function loadAbout(e) {
  if (e) e.preventDefault();
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector('.nav-item.about')?.classList.add('active');
  content.classList.remove('home');
  content.innerHTML = `
    <div class="md">
      <h1>ℹ️ À propos de ce site</h1>

      <div class="about-box">
        <h3>📘 Présentation</h3>
        <p>Ce site rassemble un <strong>cours complet de mécanique des fluides fondamentale</strong> ainsi qu'un ensemble d'<strong>exercices corrigés</strong>, conçus pour accompagner les étudiants dans la préparation de leurs examens.</p>

        <p class="label">Auteur</p>
        <p class="author-name">Dylan Perinetti</p>
        <p>Étudiant au CNAM. Si tu trouves une coquille ou souhaites suggérer une amélioration, n'hésite pas à me contacter via le dépôt GitHub du projet.</p>

        <p class="label">Sources</p>
        <ul>
          <li><strong>Cours de M. Alfarez</strong> — Mécanique des fluides fondamentale, CNAM</li>
          <li>Compléments tirés de <em>Mécanique des Fluides</em> (P.-L. Viollet)</li>
          <li><em>Fundamentals of Fluid Mechanics</em>, B.R. Munson</li>
          <li><em>An Introduction to Fluid Dynamics</em>, G.K. Batchelor</li>
        </ul>

        <p class="label">Technologies utilisées</p>
        <ul>
          <li><strong>Markdown</strong> pour le contenu pédagogique</li>

document.getElementById('searchInput').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll('aside .nav-item').forEach(n => {
    const match = !q || n.textContent.toLowerCase().includes(q);
    n.style.display = match ? '' : 'none';
  });
});

// Mobile menu
document.getElementById('menuToggle').addEventListener('click', () => {
  sidebar.classList.toggle('open');
});
backdrop.addEventListener('click', closeSidebar);
function closeSidebar() { sidebar.classList.remove('open'); }
window.addEventListener('resize', () => { if (window.innerWidth > 768) closeSidebar(); });

// Bootstrap
const initialHash = location.hash.replace('#','');
const allFiles = [...COURSES, ...EXOS].map(c => c.file);
if (initialHash === 'about') loadAbout();
else if (initialHash && allFiles.includes(initialHash)) loadCourse(initialHash);
else loadHome();
